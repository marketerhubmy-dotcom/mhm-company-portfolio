name: Portfolio Sync

# Discovers public repositories of marketerhubmy-dotcom tagged with the
# `mhm-portfolio` topic, validates their .mhm-portfolio.json, applies the
# approval registry (content/approvals.json) and commits the regenerated data
# ONLY when it changed. The commit then triggers Cloudflare Pages via its
# normal Git integration. Pushes made with GITHUB_TOKEN do not trigger
# workflows, so there is no sync → commit → sync loop.

on:
  schedule:
    - cron: '23 */6 * * *' # about every six hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Laporan sahaja — jangan commit'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'content/approvals.json'

permissions:
  contents: write

concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Sync portfolio from GitHub
        env:
          # Optional fine-grained PAT (read-only "Metadata" + "Contents") for higher
          # rate limits. Falls back to the workflow token. Never exposed to the site.
          PORTFOLIO_SYNC_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/sync-portfolio.ts ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Validate content
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Commit changes (only if data changed)
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- content/synced src/data/portfolio.generated.json && [ -z "$(git ls-files --others --exclude-standard content/synced)" ]; then
            echo "Tiada perubahan data — tiada commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/synced src/data/portfolio.generated.json
          git commit -m "chore(portfolio): sync projek daripada GitHub"
          git push
